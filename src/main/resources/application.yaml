spring:
  application:
    name: gametogether
  datasource:
    url: jdbc:postgresql://localhost:5432/gametogether
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: create
    # 테이블 생성 후 data.sql 실행토록
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
security:
  jwt:
    secret: ${JWT_SECRET}
    issuer: gametogether
    access-token-ttl-minutes: 15
logging:
  level:
    org.springframework.security: DEBUG