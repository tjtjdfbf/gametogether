spring:
  application:
    name: gametogether
  datasource:
    url: jdbc:postgresql://localhost:5432/gametogether
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: create
security:
  jwt:
    secret: ${JWT_SECRET}
    issuer: gametogether
    access-token-ttl-minutes: 15
logging:
  level:
    org.springframework.security: DEBUG